<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <script src="widget.js" defer></script>
  <script src="tracker.js" defer></script>
</head>

<body>
  <div id="agendaWidget">
    <div class="topBar">
      <div class="dayToggle">
        <span id="dayBtns"></span>
        <span class="daySep">|</span>
        <button class="speakerViewBtn" id="speakerViewBtn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><circle cx="19" cy="9" r="3"/><path d="M22 21v-1a3 3 0 0 0-3-3h-1"/></svg>
          Speakers
        </button>
        <button class="speakerViewBtn searchOpenBtn" id="searchOpenBtn" title="Search sessions & speakers">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          Search
        </button>
      </div>

      <div class="tzSelector">
        <label for="timezoneSelect">Time zone</label>
        <select id="timezoneSelect"></select>

        <div class="filterToggle">
          <button id="timeFilterBtn">Show daytime &amp; evening hours</button>
        </div>
      </div>
    </div>

    <div class="expandControls" id="expandControls">
      <button class="expandBtn" id="toggleAllBtn">Expand all</button>
      <button class="expandBtn pdfBtn" id="downloadPdfBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        <span class="pdfBtnLabel">Download full agenda (PDF)</span>
      </button>
    </div>

    <div id="skillNote" class="skillNote" style="display:none">
      Skill Building Institutes are immersive, extended learning workshops.
      <a href="https://cvent.me/Xmd3Oo" target="_blank" rel="noopener">Learn more ↗</a>
    </div>

    <div id="agendaGrid"></div>
    <div id="speakerGrid" style="display:none"></div>
  </div>

  <!-- Speaker modal -->
  <div id="spModalOverlay" class="spModalOverlay" onclick="if(event.target===this)closeSpeakerModal()">
    <div class="spModal">
      <button class="spModalClose" onclick="closeSpeakerModal()">&#x2715;</button>
      <div id="spModalBody"></div>
    </div>
  </div>

  <!-- Search popup -->
  <div id="searchOverlay" class="searchOverlay" onclick="if(event.target===this)closeSearch()">
    <div class="searchModal" role="dialog" aria-modal="true" aria-label="Search sessions and speakers">
      <div class="searchBar">
        <svg class="searchBarIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="text" autocomplete="off" spellcheck="false" placeholder="Search sessions, topics, or speakers…">
        <button class="searchClose" id="searchCloseBtn" title="Close" onclick="closeSearch()">&#x2715;</button>
      </div>
      <div id="searchResults" class="searchResults"></div>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <script src="sessionsByBlock.js" defer></script>
  <script src="widget.js" defer></script>
</head>

<body>
  <div id="agendaWidget">
    <div class="topBar">
      <div class="dayToggle">
        <button class="dayBtn active" data-day="day1">Oct 6 • Skill Building Institutes</button>
        <button class="dayBtn" data-day="day2">Oct 7 • The Global Gathering</button>
        <button class="dayBtn" data-day="day3">Oct 8 • The Global Gathering</button>
        <span class="daySep">|</span>
        <button class="speakerViewBtn" id="speakerViewBtn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><circle cx="19" cy="9" r="3"/><path d="M22 21v-1a3 3 0 0 0-3-3h-1"/></svg>
          Speakers
        </button>
      </div>

      <div class="tzSelector">
        <label for="timezoneSelect">Time zone</label>
        <select id="timezoneSelect"></select>

        <div class="filterToggle">
          <button id="timeFilterBtn">Show daytime &amp; evening hours</button>
        </div>
      </div>
    </div>

    <div class="expandControls" id="expandControls">
      <button class="expandBtn" id="toggleAllBtn">Expand all</button>
    </div>

    <div id="skillNote" class="skillNote" style="display:none">
      Skill Building Institutes are immersive, extended learning workshops.
      <a href="https://cvent.me/Xmd3Oo" target="_blank" rel="noopener">Learn more ↗</a>
    </div>

    <div id="agendaGrid"></div>
    <div id="speakerGrid" style="display:none"></div>
  </div>

  <!-- Speaker modal -->
  <div id="spModalOverlay" class="spModalOverlay" onclick="if(event.target===this)closeSpeakerModal()">
    <div class="spModal">
      <button class="spModalClose" onclick="closeSpeakerModal()">&#x2715;</button>
      <div id="spModalBody"></div>
    </div>
  </div>
</body>
</html>
